<html lang="en">
<head>

<title>BEL | Enterprise Marketing, Sales & Revenue Realisation</title>
<style>
:root{--navy:#12395b;--blue:#1769aa;--blue2:#eaf3fb;--ink:#203247;--muted:#718096;--line:#e3eaf1;--bg:#f4f7fa;--white:#fff;--green:#18845b;--amber:#b7791f;--red:#c24141;--shadow:0 3px 14px rgba(24,55,85,.07)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;min-width:255px}.logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(145deg,#174d78,#2785bd);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.5px}.brand b{font-size:14px;color:var(--navy);display:block}.brand small{font-size:10px;color:var(--muted);letter-spacing:.7px}
.search{flex:1;max-width:480px;position:relative}.search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.search span{position:absolute;left:12px;top:8px;color:#8292a5;font-size:17px}
.topright{margin-left:auto;display:flex;align-items:center;gap:14px}.topright select{padding:8px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink)}.avatar{width:34px;height:34px;border-radius:50%;background:#dcebf8;color:var(--navy);display:grid;place-items:center;font-weight:700}
.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:258px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;overflow:auto;height:calc(100vh - 64px);position:sticky;top:64px}
.navlabel{font-size:10px;font-weight:800;color:#93a1b2;letter-spacing:1.2px;padding:14px 11px 6px}.navbtn{width:100%;border:0;background:transparent;text-align:left;padding:9px 11px;border-radius:7px;color:#4b5c70;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:12.5px;margin:1px 0}.navbtn:hover{background:#f3f7fb}.navbtn.active{background:#e8f2fb;color:#155b91;font-weight:700}.navnum{font-size:10px;color:#9aa8b8;width:24px}
main{flex:1;min-width:0;padding:24px 28px 50px;max-width:1600px;margin:0 auto;width:100%}.crumb{font-size:11px;color:#8b99a9;margin-bottom:8px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:20px}.heading h1{font-size:24px;color:#183b5c;margin:0 0 5px;font-weight:700}.heading p{margin:0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #d6e0e9;background:white;color:#34516d;padding:8px 13px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12px}.btn.primary{background:#1769aa;color:#fff;border-color:#1769aa}.btn:hover{filter:brightness(.97)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}.kpi .klabel{font-size:11px;color:#75869a}.kpi .value{font-size:25px;font-weight:750;color:#173e61;margin:6px 0}.delta{font-size:10px;color:var(--green)}.kpi .sub{font-size:10px;color:#8b99a9;margin-top:5px}.sectiontitle{font-size:14px;font-weight:700;color:#294964;margin:0 0 12px}.twocol{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:15px}.chart{height:220px;display:flex;align-items:end;gap:13px;padding:15px 8px 5px;border-bottom:1px solid var(--line)}.barwrap{flex:1;text-align:center;height:100%;display:flex;flex-direction:column;justify-content:end;gap:7px}.bar{background:linear-gradient(180deg,#5da2d2,#1769aa);border-radius:5px 5px 0 0;min-height:8px}.barwrap small{font-size:10px;color:#8392a3}.legend{display:flex;gap:14px;font-size:10px;color:#75869a;margin-top:10px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#1769aa;margin-right:5px}
.tablecard{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:15px}.tablehead{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:10px}.tablehead h3{margin:0;font-size:13px;color:#294964}.tabletools{display:flex;gap:7px}.tabletools input,.field input,.field select,.field textarea,.filter{border:1px solid #dce5ed;border-radius:6px;padding:8px 9px;background:#fff;color:#34495e;font:12px inherit}.tabletools input{width:190px}table{width:100%;border-collapse:collapse;font-size:11.5px}th{background:#f6f9fc;color:#66798d;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:11px 14px;border-bottom:1px solid var(--line)}td{padding:12px 14px;border-bottom:1px solid #edf1f5;color:#43566b}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcfe}.status{display:inline-block;border-radius:20px;padding:3px 8px;font-size:10px;font-weight:700;background:#edf4fb;color:#28618d}.status.green{background:#e8f6ef;color:#168052}.status.amber{background:#fff5df;color:#9b6a13}.status.red{background:#fdeeee;color:#b23d3d}
.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;padding:16px}.field label{display:block;font-size:10px;color:#6f8093;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px}.field textarea{min-height:72px;resize:vertical}.panel{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:15px;box-shadow:var(--shadow)}.panelhead{padding:14px 16px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:#294964}.panelbody{padding:15px 16px}.steps{display:flex;gap:0;overflow:auto;margin:5px 0 18px}.step{flex:1;min-width:105px;padding:11px 8px;text-align:center;border-bottom:3px solid #dce6ef;color:#8493a3;font-size:10px}.step.done{border-color:#25936c;color:#168052}.step.current{border-color:#1769aa;color:#1769aa;font-weight:700}.step b{display:block;font-size:11px;margin-bottom:3px}
.notice{padding:11px 13px;background:#f0f6fc;border:1px solid #d9e9f7;border-radius:8px;color:#466783;font-size:11px;margin-bottom:14px}.empty{padding:35px;text-align:center;color:#8191a2}.timeline{border-left:2px solid #dce8f2;margin:8px 0 0 8px;padding-left:18px}.event{position:relative;padding:0 0 17px}.event:before{content:"";position:absolute;left:-24px;top:4px;width:9px;height:9px;border-radius:50%;background:#4b91c4;border:2px solid white;box-shadow:0 0 0 1px #4b91c4}.event small{color:#8a99a9}.event b{display:block;font-size:12px}.footer{font-size:10px;color:#97a4b2;text-align:right;padding:8px}
.modalbg{display:none;position:fixed;inset:0;background:#17324c66;z-index:10;align-items:center;justify-content:center;padding:20px}.modal{background:#fff;width:min(600px,100%);border-radius:12px;box-shadow:0 20px 70px #17324c55}.modalhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:700;color:#244966}.modalbody{padding:20px}.modalfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
@media(max-width:1000px){aside{width:220px}.grid{grid-template-columns:repeat(2,1fr)}.twocol{grid-template-columns:1fr}}
@media(max-width:680px){.top{padding:0 12px}.brand{min-width:auto}.brand small,.search{display:none}aside{width:62px;padding:12px 6px}.navlabel{display:none}.navbtn{justify-content:center;font-size:0;padding:12px 4px}.navnum{font-size:10px;width:auto}main{padding:18px 12px}.grid{grid-template-columns:repeat(2,1fr)}.heading{display:block}.actions{margin-top:12px}.formgrid{grid-template-columns:1fr}.topright select{max-width:115px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><div class="logo">BEL</div><div><b>Enterprise Commercial Suite</b><small>MARKETING • SALES • REVENUE REALISATION</small></div></div>

<div class="layout"><aside id="sidebar"></aside><main id="main"></main></div>

<script>
const groups=[
["OVERVIEW",["S02 – Home / My Work","S03 – Executive Dashboard"]],
["MARKET & LEADS",["S04 – Market Intelligence Inbox","S05 – Tender / RFI-RFP Capture","S06 – Lead Register / Search","S07 – Lead 360 / Detail","S08 – Lead Create / Edit","S09 – Customer 360","S10 – Customer / Contact Master","S11 – Qualification & Bid/No-Bid","S12 – Lead Assignment Board"]],
["PRE-SALES & COMMERCIAL",["S13 – Requirement Analysis","S14 – Proposal Workspace","S15 – Compliance Matrix","S16 – Costing & Commercial Approval","S17 – POC / Demo Management","S18 – Proposal Submission & Evaluation","S19 – Negotiation & Win/Loss"]],
["CONTRACT & EXECUTION",["S20 – Contract / Award Register","S21 – Order Booking & Handover","S22 – Order Book / Backlog","S23 – Delivery & Dispatch Plan","S24 – Dispatch / Delivery Confirmation"]],
["BILLING & COLLECTIONS",["S25 – Billing Plan & Milestones","S26 – Invoice Workbench","S27 – Invoice Submission Tracker","S28 – Receivables Dashboard","S29 – Customer Collection 360","S30 – Collection Follow-up & Escalation","S31 – Payment Receipt & Allocation"]],
["INTELLIGENCE & CONTROL",["S32 – AI Insights & Forecast","S33 – Reports & Analytics Studio","S34 – Workflow, SLA & Administration"]],
["ACCESS",["S01 – Login / SSO"]]
];
const info={
"S01 – Login / SSO":["Authenticate through enterprise identity provider with MFA and session controls.","User ID / SSO, MFA, passwordless option, sign-in, support link."],
"S02 – Home / My Work":["Role-specific landing page with assigned tasks, due items, alerts and personal KPIs.","Task cards, overdue list, calendar strip, quick-create, KPI tiles."],
"S03 – Executive Dashboard":["Enterprise view of pipeline, orders, dispatch, billing, cash and risks.","Date range, SBU, product, customer, currency; KPI cards; trend charts; drilldowns."],
"S04 – Market Intelligence Inbox":["Review ingested government, market, customer and partner intelligence.","Source filter, keyword, date, source document preview, relevance score, create lead."],
"S05 – Tender / RFI-RFP Capture":["Register or validate procurement notices and deadlines.","Tender reference, authority, customer, end user, scope, due date, value, URL, attachments."],
"S06 – Lead Register / Search":["Search, filter and manage leads.","Lead ID, title, customer, source, SBU, stage, value, owner, next action, target order date."],
"S07 – Lead 360 / Detail":["Single view of lead, timeline, customer, documents, tasks, proposal and forecast.","Overview, stakeholders, qualification, activity, documents, commercial, history."],
"S08 – Lead Create / Edit":["Create or amend opportunity with mandatory fields and source traceability.","Title, source, source date/ref, customer, end user, product, value, currency, order date, dispatch window, owner, SBU."],
"S09 – Customer 360":["View account hierarchy, contacts, history, orders, invoices and collection health.","Customer identifiers, hierarchy, addresses, contacts, installed base, risk notes."],
"S10 – Customer / Contact Master":["Create and govern customer and contact data.","Legal name, customer type, tax IDs, parent, sites, address, contact role, email, phone."],
"S11 – Qualification & Bid/No-Bid":["Score opportunity and record bid decision.","Strategic fit, technical fit, budget, competition, margin, delivery risk, bid cost, evidence, decision."],
"S12 – Lead Assignment Board":["Allocate lead and pre-sales resources.","Lead, SBU, skill tags, workload, due date, owner, pre-sales lead, contributors."],
"S13 – Requirement Analysis":["Capture customer needs and solution fit.","Requirement tree, product match, gaps, assumptions, clarification log, compliance status."],
"S14 – Proposal Workspace":["Build proposal pack and manage versions.","Proposal ID, version, scope, solution, compliance, assumptions, schedule, warranty, documents."],
"S15 – Compliance Matrix":["Map RFP clauses to evidence and compliance status.","Clause ID, requirement, response, status, deviation, evidence reference, reviewer."],
"S16 – Costing & Commercial Approval":["Prepare price, cost, margin and approval workflow.","Cost elements, taxes, currency, discount, margin, validity, payment terms, risk, approvers."],
"S17 – POC / Demo Management":["Plan and record proof-of-concept or demonstration.","Objective, success criteria, environment, participants, schedule, test cases, results, issues, sign-off."],
"S18 – Proposal Submission & Evaluation":["Record submission and customer evaluation events.","Submission channel/date, version, receipt, clarifications, evaluation status, ranking if disclosed."],
"S19 – Negotiation & Win/Loss":["Capture negotiation, selection, rejection and loss intelligence.","Negotiation rounds, revised offer, selected/rejected/lost/withdrawn, reason, competitor, evidence."],
"S20 – Contract / Award Register":["Capture LOA, award, PO, contract and obligations.","Award ref/date, customer, value, currency, scope, clauses, securities, milestones, attachments."],
"S21 – Order Booking & Handover":["Convert award into executable order and conduct handover.","Order lines, quantity, value, tax, payment terms, delivery dates, billing plan, risk and handover checklist."],
"S22 – Order Book / Backlog":["View confirmed order book and backlog.","Order, customer, SBU, value, booked date, open value, dispatch due, risk, project owner."],
"S23 – Delivery & Dispatch Plan":["Manage line-wise milestones and dispatch windows.","Order line, site, quantity, milestone, baseline/forecast/actual dates, dependencies, owner."],
"S24 – Dispatch / Delivery Confirmation":["Record dispatch, shipment and customer receipt.","Dispatch note, date, quantity, serials, transporter, consignment, proof of delivery, acceptance."],
"S25 – Billing Plan & Milestones":["Set billing triggers from contract clauses.","Milestone, trigger event, percentage/value, required evidence, due-date rule, retention."],
"S26 – Invoice Workbench":["Prepare and validate invoice drafts.","Customer, PO, order line, milestone, tax, amount, due terms, supporting documents."],
"S27 – Invoice Submission Tracker":["Track customer submission and acceptance.","Invoice no/date, portal/email, submission proof, acknowledgement, rejection, resubmission date."],
"S28 – Receivables Dashboard":["Monitor outstanding, due, overdue, ageing, disputes and DSO.","As-of date, SBU, customer, ageing bucket, currency, risk class."],
"S29 – Customer Collection 360":["View all invoices, promises, disputes and customer payment history.","Customer, contacts, total outstanding, oldest due, next action, payment pattern, dispute owner."],
"S30 – Collection Follow-up & Escalation":["Log calls/emails, promise-to-pay, dispute and next action.","Invoice, contact, channel, date, outcome, promised date/amount, blocker, next follow-up, escalation."],
"S31 – Payment Receipt & Allocation":["Import/review receipts and allocate to invoices.","Bank/ERP receipt ref, date, amount, currency, payer, invoice allocations, deductions, bank reference."],
"S32 – AI Insights & Forecast":["Show explainable recommendations and predictive indicators.","Model, horizon, SBU, lead, risk factors, confidence, evidence, override reason."],
"S33 – Reports & Analytics Studio":["Build standard and saved reports with governed dimensions.","Dataset, dimensions, measures, filters, schedule, format, recipients."],
"S34 – Workflow, SLA & Administration":["Configure stages, reason codes, assignment rules, approval matrix, templates and SLAs.","Workflow version, rule conditions, effective date, approvers, notification templates, test mode."]
};
const records={
"S04 – Market Intelligence Inbox":[["MI-26041","RFP – Tactical communication upgrade","Government portal","Defence Customer","92%","New"],["MI-26040","Radar maintenance requirement","Customer email","Naval Customer","88%","Under review"],["MI-26039","Secure display modernisation","Market bulletin","Strategic Account","84%","Lead drafted"]],
"S05 – Tender / RFI-RFP Capture":[["TND-041","PROC/2026/041","Defence Customer","₹12.50 Cr","12-Nov-2026","Open"],["TND-038","RFP/26/118","Naval Customer","₹8.20 Cr","19-Nov-2026","Under review"]],
"S06 – Lead Register / Search":[["LD-26041","Tactical communication system upgrade","Defence Customer","Radar","₹12.50 Cr","Qualified","A. Kumar"],["LD-26038","Naval display modernisation","Naval Customer","Display","₹8.20 Cr","Proposal","R. Sharma"],["LD-26031","Gun control electronics","Strategic Account","Electronics","₹5.40 Cr","Evaluation","S. Rao"],["LD-26022","Secure voice C2 system","Defence Customer","C2","₹3.75 Cr","Bid decision","M. Das"]],
"S22 – Order Book / Backlog":[["ORD-26018","Defence Customer","Radar","₹18.40 Cr","₹7.20 Cr","31-Mar-2027","On track"],["ORD-26015","Naval Customer","Display","₹12.60 Cr","₹4.10 Cr","15-Feb-2027","At risk"],["ORD-26011","Strategic Account","Electronics","₹7.80 Cr","₹1.20 Cr","30-Jan-2027","On track"]],
"S23 – Delivery & Dispatch Plan":[["ORD-26018","Engineering readiness","100%","04-Nov-2026","04-Nov-2026","Complete"],["ORD-26018","Production readiness","72%","18-Nov-2026","21-Nov-2026","At risk"],["ORD-26015","Customer inspection","0%","22-Nov-2026","22-Nov-2026","Planned"]],
"S28 – Receivables Dashboard":[["INV-26081","Defence Customer","₹2.40 Cr","15-Oct-2026","21 days","Overdue"],["INV-26074","Naval Customer","₹1.15 Cr","28-Nov-2026","Not due","Open"],["INV-26063","Strategic Account","₹0.82 Cr","30-Sep-2026","36 days","Overdue"]],
"S31 – Payment Receipt & Allocation":[["RCT-11802","Defence Customer","₹0.80 Cr","04-Nov-2026","INV-26081","Partially allocated"],["RCT-11796","Naval Customer","₹1.15 Cr","02-Nov-2026","INV-26074","Reconciled"]]
};
let current="S03 – Executive Dashboard", modalMode="";
function buildNav(){let h="";groups.forEach(g=>{h+=`<div class="navlabel">${g[0]}</div>`;g[1].forEach(n=>{let id=n.slice(0,3);h+=`<button class="navbtn ${n===current?'active':''}" onclick="go('${n.replace(/'/g,"\\'")}')"><span class="navnum">${id}</span><span>${n.slice(6)}</span></button>`})});document.getElementById("sidebar").innerHTML=h}
function go(n){current=n;buildNav();render();window.scrollTo(0,0)}
function heading(title,desc,actions=true){return `<div class="crumb">Enterprise Suite / ${current}</div><div class="heading"><div><h1>${title}</h1><p>${desc||""}</p></div><div class="actions">${actions?'<button class="btn" onclick="toast(\'Export prepared for authorised data.\')">↓ Export</button><button class="btn primary" onclick="openCreate()">＋ Create New</button>':''}</div></div>`}
function dashboard(){return `<div class="grid">
${[['Active Pipeline','₹486.5 Cr','↑ 8.4% vs previous quarter','Weighted opportunity value'],['Order Book','₹238.7 Cr','↑ 12.1% year-on-year','Confirmed awarded orders'],['Billed This FY','₹96.2 Cr','↑ 6.8% vs plan','ERP-posted invoice value'],['Collections','₹72.8 Cr','75.7% of billed value','Reconciled receipts']].map(x=>`<div class="card kpi"><div class="klabel">${x[0]}</div><div class="value">${x[1]}</div><div class="delta">${x[2]}</div><div class="sub">${x[3]}</div></div>`).join('')}
</div><div class="twocol"><div class="card"><h3 class="sectiontitle">Order acquisition trend</h3><div class="chart">${[38,52,44,66,58,78,70,91,82,100,88,110].map((v,i)=>`<div class="barwrap"><div class="bar" style="height:${v*1.45}px"></div><small>${['Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov'][i]}</small></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>Order intake (₹ Cr)</span><span>Illustrative sample data</span></div></div><div class="card"><h3 class="sectiontitle">Revenue realisation snapshot</h3>${[['Billed','₹96.2 Cr',78],['Collected','₹72.8 Cr',59],['Open receivables','₹23.4 Cr',24],['Overdue','₹8.6 Cr',9]].map(a=>`<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px"><b>${a[0]}</b><span>${a[1]}</span></div><div style="height:8px;background:#edf2f6;border-radius:9px"><div style="height:8px;width:${a[2]}%;background:#2d82b9;border-radius:9px"></div></div></div>`).join('')}</div></div>
<div class="twocol"><div class="tablecard"><div class="tablehead"><h3>Priority opportunities</h3><button class="btn" onclick="go('S06 – Lead Register / Search')">View all</button></div>${table(["Lead ID","Opportunity","Customer","Value","Stage"],records["S06 – Lead Register / Search"].slice(0,3).map(r=>r.slice(0,6)))}</div><div class="card"><h3 class="sectiontitle">Management attention</h3><div class="timeline"><div class="event"><small>Today • Dispatch</small><b>ORD-26015 delivery forecast at risk</b><span style="font-size:11px;color:#718096">Recovery plan requested from execution owner</span></div><div class="event"><small>Today • Collections</small><b>INV-26081 overdue by 21 days</b><span style="font-size:11px;color:#718096">Follow-up and escalation pending</span></div><div class="event"><small>Tomorrow • Tender</small><b>TND-041 closing in 7 days</b><span style="font-size:11px;color:#718096">Compliance review due</span></div></div></div></div>
<div class="tablecard"><div class="tablehead"><h3>Commercial lifecycle health</h3><span class="status green">Data freshness: 05 Nov 2026 • 19:45 IST</span></div><div style="padding:16px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px">${[['Market → Lead','142','18 new'],['Lead → Proposal','64','12 due'],['Proposal → Award','21','4 pending'],['Order → Dispatch','38','3 at risk'],['Invoice → Cash','₹23.4 Cr','₹8.6 Cr overdue']].map(x=>`<div style="border-right:1px solid #edf1f5;padding-right:8px"><div style="font-size:10px;color:#8493a3">${x[0]}</div><b style="font-size:18px;color:#244e70">${x[1]}</b><div style="font-size:10px;color:#9b6a13">${x[2]}</div></div>`).join('')}</div></div>`}
function table(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===r.length-1?status(c):c}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function status(s){let t=String(s);let cls=/overdue|risk|rejected|lost|blocked/i.test(t)?'red':/complete|reconciled|won|approved|on track|accepted/i.test(t)?'green':/pending|review|planned|open|qualified|proposal|draft|partially/i.test(t)?'amber':'';return `<span class="status ${cls}">${t}</span>`}
function generic(n){let d=info[n]||["Manage the selected enterprise process.",""];let rows=records[n]||makeRows(n);let headers=makeHeaders(n,rows);let stage=n.includes("Lead")||n.includes("Proposal")||n.includes("Order")?["Registered","Qualified","Bid decision","Proposal","Evaluation","Award","Execution"]:null;
return `${heading(n.slice(6),d[0])}<div class="notice"><b>Purpose:</b> ${d[0]} <span style="float:right">Screen ID: ${n.slice(0,3)} • SRS v1.0</span></div>
${stage?`<div class="panel"><div class="panelhead">Lifecycle stage overview</div><div class="panelbody"><div class="steps">${stage.map((s,i)=>`<div class="step ${i<2?'done':i===2?'current':''}"><b>${i+1}</b>${s}</div>`).join('')}</div></div></div>`:''}
<div class="panel"><div class="panelhead">Record information & key controls</div><div class="formgrid">${d[1].split(/, |; /).slice(0,9).map((f,i)=>`<div class="field"><label>${f.replace(/\.$/,'')}</label>${i===2||/status|type|source|stage|decision|currency|channel/i.test(f)?`<select><option>Select ${f.toLowerCase()}</option><option>Draft</option><option>Under review</option><option>Approved</option><option>Rejected</option></select>`:`<input placeholder="Enter ${f.toLowerCase()}" ${i===0?'value="BEL-'+n.slice(0,3)+'-0001"':''}>`}</div>`).join('')}</div><div style="padding:0 16px 15px;display:flex;gap:8px"><button class="btn primary" onclick="toast('Draft saved. No live system posting performed.')">Save Draft</button><button class="btn" onclick="toast('Validation completed: sample prototype checks only.')">Validate</button><button class="btn" onclick="toast('Submitted to illustrative workflow queue.')">Submit for Review</button></div></div>
<div class="tablecard"><div class="tablehead"><h3>Recent records</h3><div class="tabletools"><input placeholder="Filter records…" oninput="filterTable(this)"><button class="btn" onclick="toast('Export prepared for authorised data.')">Export</button></div></div>${table(headers,rows)}</div>
<div class="twocol"><div class="card"><h3 class="sectiontitle">Activity & audit timeline</h3><div class="timeline"><div class="event"><small>05 Nov 2026 • 14:10</small><b>Record reviewed by process owner</b><span style="font-size:11px;color:#718096">Sample event • change history retained</span></div><div class="event"><small>04 Nov 2026 • 16:35</small><b>Supporting document attached</b><span style="font-size:11px;color:#718096">Evidence linked to record</span></div></div></div><div class="card"><h3 class="sectiontitle">Documents & controls</h3><p style="font-size:11px;color:#708195">Attach source evidence, approvals, customer correspondence and supporting documents. Submitted versions remain immutable; changes should create a new version where applicable.</p><button class="btn" onclick="toast('Document picker is represented in this prototype.')">＋ Add document</button></div></div>`}
function makeHeaders(n,rows){if(n.includes("Lead Register"))return ["Lead ID","Opportunity","Customer","Product","Estimated value","Stage","Owner"];if(n.includes("Tender"))return ["Tender ID","Reference","Customer","Estimated value","Due date","Status"];if(n.includes("Intelligence"))return ["Item ID","Title","Source","Customer","Relevance","Status"];if(n.includes("Order Book"))return ["Order","Customer","SBU / Product","Order value","Open value","Dispatch due","Risk"];if(n.includes("Delivery"))return ["Order","Milestone","Progress","Baseline","Forecast","Status"];if(n.includes("Receivables"))return ["Invoice","Customer","Outstanding","Due date","Ageing","Status"];if(n.includes("Payment"))return ["Receipt","Payer","Amount","Receipt date","Invoice","Status"];return ["Record ID","Reference / Description","Customer / Owner","Created / Due","Value / Detail","Status"]}
function makeRows(n){let id=n.slice(0,3);return [[id+"-00031","Illustrative "+n.slice(6),"Defence Customer","05-Nov-2026","₹2.40 Cr","Under review"],[id+"-00028","Sample enterprise record","Naval Customer","04-Nov-2026","₹1.15 Cr","Approved"],[id+"-00024","Pending validation","Strategic Account","30-Oct-2026","₹0.82 Cr","Pending"]]}
function render(){document.title=current+" | BEL";let el=document.getElementById("main");if(current==="S03 – Executive Dashboard")el.innerHTML=heading("Executive Dashboard","Enterprise-wide commercial performance • Board / CMD / CEO view",false)+dashboard();else if(current==="S02 – Home / My Work")el.innerHTML=heading("My Work","Your assigned tasks, due items and alerts",false)+`<div class="grid">${[['My open tasks','18'],['Due today','6'],['Overdue','3'],['Awaiting my approval','4']].map(x=>`<div class="card kpi"><div class="klabel">${x[0]}</div><div class="value">${x[1]}</div><div class="sub">Across assigned records</div></div>`).join('')}</div><div class="tablecard"><div class="tablehead"><h3>My task queue</h3><button class="btn primary" onclick="toast('Task list refreshed.')">Refresh</button></div>${table(["Task","Reference","Due date","Priority","Status"],[["Complete compliance review","LD-26041","07-Nov-2026","High","Open"],["Confirm dispatch recovery plan","ORD-26015","06-Nov-2026","High","Overdue"],["Review invoice acknowledgement","INV-26081","08-Nov-2026","Medium","Pending"]])}</div>`;else el.innerHTML=generic(current)}
function openCreate(){modalMode="create";document.getElementById("modalTitle").textContent="Create – "+current.slice(6);let d=info[current][1];document.getElementById("modalBody").innerHTML=`<div class="notice">Create a draft record. Required fields and approval rules are configurable in the production implementation.</div><div class="formgrid" style="padding:0">${d.split(/, |; /).slice(0,6).map(f=>`<div class="field"><label>${f}</label><input placeholder="Enter ${f.toLowerCase()}"></div>`).join('')}</div>`;document.getElementById("modalbg").style.display="flex"}
function closeModal(){document.getElementById("modalbg").style.display="none"}
function saveModal(){closeModal();toast("Draft created in the local prototype session.")}
function filterTable(input){let q=input.value.toLowerCase();input.closest(".tablecard").querySelectorAll("tbody tr").forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none")}
function searchGlobal(q){if(!q.trim())return;let target=groups.flatMap(g=>g[1]).find(n=>n.toLowerCase().includes(q.toLowerCase())||q.toLowerCase().includes("lead")&&n.includes("Lead Register")||q.toLowerCase().includes("invoice")&&n.includes("Invoice Workbench"));if(target)go(target);else toast("No matching prototype screen. Try lead, tender, order, invoice or customer.")}
function changeRole(){let r=document.getElementById("role").value;toast("Role view switched to "+r+". Data visibility shown here is illustrative; enforce RBAC and row-level scope on the server.")}
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:22px;right:22px;background:#173f60;color:white;padding:12px 17px;border-radius:8px;box-shadow:0 8px 30px #1234;z-index:20;font-size:12px;max-width:360px";document.body.appendChild(t)}t.textContent=msg;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",3200)}
buildNav();render();
</script>
</body></html>
